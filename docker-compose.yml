services:
  web:
    build: .
    ports: ["5000:5000"]
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-this-before-deploy}
      DATABASE_URL: postgresql+psycopg://stockflow:stockflow@db:5432/stockflow
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrador}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeThisPassword!}
      BOOTSTRAP_ORG_NAME: ${BOOTSTRAP_ORG_NAME:-Demo Company}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U stockflow -d stockflow"]
      interval: 5s
      timeout: 5s
      retries: 8
volumes:
  postgres_data:
