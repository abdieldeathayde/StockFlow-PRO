<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · StockFlow Pro</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static',filename='css/main.css') }}" rel="stylesheet"></head><body class="login"><div class="loginbox"><h1 class="h3 fw-bold">StockFlow <span class="text-primary">Pro</span></h1><p class="text-secondary">Acesse sua empresa</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert alert-{{ c }}">{{ m }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">E-mail</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Senha</label><input class="form-control mb-4" type="password" name="password" required><button class="btn btn-primary w-100">Entrar</button></form></div></body></html>
