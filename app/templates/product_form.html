{% extends 'base.html' %}{% block title %}Produto{% endblock %}{% block content %}<h1 class="h3 fw-bold mb-3">{{ 'Editar produto' if product else 'Novo produto' }}</h1><div class="panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3">{% set p=product %}<div class="col-md-4"><label class="form-label">SKU *</label><input class="form-control" name="sku" required value="{{ p.sku if p else '' }}"></div><div class="col-md-4"><label class="form-label">Código barras</label><input class="form-control" name="barcode" value="{{ p.barcode if p and p.barcode else '' }}"></div><div class="col-md-4"><label class="form-label">Nome *</label><input class="form-control" name="name" required value="{{ p.name if p else '' }}"></div><div class="col-md-4"><label class="form-label">Locação</label><input class="form-control" name="location" maxlength="120" value="{{ p.location if p else '' }}"></div><div class="col-md-4"><label class="form-label">NCM</label><input class="form-control" name="ncm" maxlength="20" value="{{ p.ncm if p else '' }}"></div><div class="col-md-6"><label class="form-label">Categoria</label><input class="form-control" name="category" value="{{ p.category if p else '' }}"></div><div class="col-md-6"><label class="form-label">Descrição</label><input class="form-control" name="description" value="{{ p.description if p else '' }}"></div><div class="col-md-3"><label class="form-label">Custo</label><input type="number" step=".01" min="0" class="form-control" name="cost_price" value="{{ p.cost_price if p else 0 }}"></div><div class="col-md-3"><label class="form-label">Venda</label><input type="number" step=".01" min="0" class="form-control" name="sale_price" value="{{ p.sale_price if p else 0 }}"></div><div class="col-md-3"><label class="form-label">Saldo inicial</label><input type="number" min="0" class="form-control" name="quantity" value="{{ p.quantity if p else 0 }}" {% if p %}readonly{% endif %}></div><div class="col-md-3"><label class="form-label">Mínimo</label><input type="number" min="0" class="form-control" name="minimum_quantity" value="{{ p.minimum_quantity if p else 0 }}"></div></div><button class="btn btn-primary mt-3">Salvar</button><a class="btn btn-outline-secondary mt-3" href="{{ url_for('products.index') }}">Cancelar</a></form></div>{% endblock %}
