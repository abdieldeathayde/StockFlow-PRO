<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro · StockFlow Pro</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static',filename='css/main.css') }}" rel="stylesheet"></head><body class="login"><div class="loginbox"><h1 class="h3 fw-bold">Criar conta <span class="text-primary">StockFlow</span></h1><p class="text-secondary">Cadastre sua empresa para começar</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert alert-{{ c }}">{{ m }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label" for="name">Seu nome</label><input class="form-control mb-3" id="name" name="name" maxlength="120" autocomplete="name" required><label class="form-label" for="organization">Nome da empresa</label><input class="form-control mb-3" id="organization" name="organization" maxlength="160" autocomplete="organization" required><label class="form-label" for="email">E-mail</label><input class="form-control mb-3" id="email" type="email" name="email" maxlength="190" autocomplete="email" required><label class="form-label" for="password">Senha</label><input class="form-control mb-3" id="password" type="password" name="password" minlength="8" autocomplete="new-password" required><label class="form-label" for="password_confirmation">Confirme a senha</label><input class="form-control mb-4" id="password_confirmation" type="password" name="password_confirmation" minlength="8" autocomplete="new-password" required><button class="btn btn-primary w-100">Criar conta</button></form><p class="text-center text-secondary mt-4 mb-0">Já possui uma conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p></div></body></html>
