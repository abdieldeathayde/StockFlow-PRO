{% extends 'base.html' %}{% block title %}Fornecedores{% endblock %}{% block content %}<div class="d-flex justify-content-between mb-3"><h1 class="h3 fw-bold">Fornecedores</h1><a class="btn btn-primary" href="{{ url_for('suppliers.new') }}">+ Novo</a></div><div class="panel table-responsive"><table class="table"><thead><tr><th>Nome</th><th>Documento</th><th>Email</th><th>Telefone</th></tr></thead><tbody>{% for s in suppliers %}<tr><td>{{ s.name }}</td><td>{{ s.document }}</td><td>{{ s.email }}</td><td>{{ s.phone }}</td></tr>{% else %}<tr><td colspan="4">Sem fornecedores.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
