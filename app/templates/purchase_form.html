{% extends 'base.html' %}{% block title %}Novo pedido{% endblock %}{% block content %}<h1 class="h3 fw-bold">Novo pedido de compra</h1><div class="panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Fornecedor</label><select name="supplier_id" class="form-select mb-3" required><option value="">Selecione</option>{% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select><label class="form-label">Produto</label><select name="product_id" class="form-select mb-3" required><option value="">Selecione</option>{% for p in products %}<option value="{{ p.id }}">{{ p.sku }} — {{ p.name }}</option>{% endfor %}</select><div class="row"><div class="col-md-6"><label class="form-label">Quantidade</label><input name="quantity" type="number" min="1" class="form-control mb-3" required></div><div class="col-md-6"><label class="form-label">Custo unitário</label><input name="cost" type="number" min="0" step=".01" class="form-control mb-3" required></div></div><label class="form-label">Notas</label><textarea name="notes" class="form-control mb-3"></textarea><button class="btn btn-primary">Criar pedido</button></form></div>{% endblock %}
